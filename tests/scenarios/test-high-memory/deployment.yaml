apiVersion: v1
kind: Namespace
metadata:
  name: test-high-memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-pressure
  namespace: test-high-memory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-pressure
  template:
    metadata:
      labels:
        app: memory-pressure
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          # Потребляет 90Mi, лимит 100Mi — под живёт но на грани
          args: ["--vm", "1", "--vm-bytes", "90M", "--vm-hang", "0"]
          resources:
            requests:
              memory: "50Mi"
            limits:
              memory: "100Mi"