apiVersion: v1
kind: Namespace
metadata:
  name: test-oom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: test-oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "0"]
          resources:
            limits:
              memory: "16Mi"