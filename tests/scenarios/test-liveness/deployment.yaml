apiVersion: v1
kind: Namespace
metadata:
  name: test-liveness
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-liveness
  namespace: test-liveness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-liveness
  template:
    metadata:
      labels:
        app: bad-liveness
    spec:
      containers:
        - name: app
          image: busybox
          command: ["sh", "-c", "while true; do sleep 5; done"]
          livenessProbe:
            exec:
              # Всегда падает — имитируем зависший процесс
              command: ["sh", "-c", "exit 1"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"