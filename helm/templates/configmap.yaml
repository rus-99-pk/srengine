apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srengine.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srengine.labels" . | nindent 4 }}
data:
  # Промпт монтируется в /etc/srengine/prompt.txt
  # Значение берётся из файла при сборке чарта через --set-file или inline ниже.
  # По умолчанию — пустая строка, агент упадёт при старте если файл пуст.
  prompt.txt: |
    {{ .Values.prompt | default "" | nindent 4 }}
