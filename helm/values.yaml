replicaCount: 1

image:
  repository: ghcr.io/rus-99-pk/srengine
  tag: latest
  pullPolicy: IfNotPresent

# Namespaces которые агент мониторит и имеет доступ к ресурсам
namespaces:
  - production
  - staging
  - monitoring

agent:
  maxSteps: 12
  stepTimeout: 60s
  investigTimeout: 5m
  summarizeEvery: 4

llm:
  provider: ollama
  ollamaUrl: http://ollama:11434
  model: qwen2.5:7b
  timeout: 120s
  maxRetries: 2

logs:
  maxLines: 500
  maxPatterns: 20
  levels:
    - ERROR
    - WARN

server:
  addr: ":8080"

metrics:
  prometheusUrl: ""   # http://prometheus-operated.monitoring:9090
  timeout: 15s

# ── Notifiers ──────────────────────────────────────────────────────────────────
# Можно включить несколько одновременно — отчёт уйдёт во все каналы параллельно.
# Если все disabled — fallback на stdout.
notifier:
  telegram:
    enabled: false
    token: ""     # рекомендуется задавать через --set или SOPS-зашифрованный values
    chatId: ""

  email:
    enabled: false
    smtpHost: ""
    smtpPort: 587
    from: ""
    to: []          # ["sre@company.com", "oncall@company.com"]
    password: ""    # пусто = anonymous relay (internal SMTP без auth)

  webhook:
    enabled: false
    url: ""
    timeout: 10s
    headers: {}     # пример: {Authorization: "Bearer token"}

# ── Ollama ─────────────────────────────────────────────────────────────────────
ollama:
  enabled: true
  image: ollama/ollama:latest
  model: qwen2.5:7b
  resources:
    requests:
      memory: "6Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""   # пусто = default StorageClass кластера

# ── Agent resources ────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

serviceAccount:
  create: true
  name: ""          # пусто = генерируется из fullname

service:
  type: ClusterIP
  port: 8080

# ── Probes ─────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# ── NetworkPolicy ──────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  # Namespace где живёт Alertmanager — разрешает входящие webhook на :8080
  # Стандартные варианты: monitoring, observability
  alertmanagerNamespace: monitoring

# ── PodDisruptionBudget ────────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  # Для singleton (replicaCount=1): maxUnavailable=1 позволяет node drain
  # не застревать, при этом Kubernetes сначала поднимет новый под.
  maxUnavailable: 1
