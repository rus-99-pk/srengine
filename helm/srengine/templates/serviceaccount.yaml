{{- if .Values.serviceAccount.create }}
# ServiceAccount used by the agent to access the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srengine.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srengine.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}