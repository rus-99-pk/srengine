replicaCount: 1

image:
  repository: ghcr.io/rus-99-pk/srengine
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
  # - name: registry-secret

# Namespaces monitored by the agent (requires RBAC access)
namespaces:
  - production
  - staging
  - monitoring

# ── Agent Configuration ────────────────────────────────────────────────────────
agent:
  maxSteps: 12
  stepTimeout: 60s
  investigTimeout: 5m
  summarizeEvery: 4

llm:
  provider: ollama
  ollamaUrl: http://ollama:11434
  model: qwen2.5:7b
  timeout: 120s
  maxRetries: 2

logs:
  maxLines: 500
  maxPatterns: 20
  levels:
    - ERROR
    - WARN

server:
  addr: ":8080"

metrics:
  prometheusUrl: ""   # e.g., http://prometheus-operated.monitoring:9090
  timeout: 15s

# ── Notifiers ──────────────────────────────────────────────────────────────────
# Multiple notifiers can be enabled simultaneously; reports will be sent in parallel.
# If all are disabled, the fallback is to print reports to stdout.
notifier:
  telegram:
    enabled: false
    token: ""     # Recommended to pass via --set or use SOPS-encrypted values
    chatId: ""

  email:
    enabled: false
    smtpHost: ""
    smtpPort: 587
    from: ""
    to: []          # e.g., ["sre@company.com", "oncall@company.com"]
    password: ""    # Leave empty for anonymous relay (internal SMTP without auth)

  webhook:
    enabled: false
    url: ""
    timeout: 10s
    headers: {}     # example: {Authorization: "Bearer token"}

# ── Ollama ─────────────────────────────────────────────────────────────────────
ollama:
  enabled: true
  image: ollama/ollama:latest
  model: qwen2.5:7b
  resources:
    requests:
      memory: "6Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""   # Leave empty to use the cluster's default StorageClass

# ── Agent resources ────────────────────────────────────────────────────────────
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

serviceAccount:
  create: true
  name: ""          # Leave empty to auto-generate based on fullname

service:
  type: ClusterIP
  port: 8080

# ── Probes ─────────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ── NetworkPolicy ──────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  # Namespace where Alertmanager resides — allows inbound webhooks on port 8080.
  # Standard options: monitoring, observability
  alertmanagerNamespace: monitoring

# ── PodDisruptionBudget ────────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  # For singleton deployments (replicaCount=1): maxUnavailable=1 allows node drains
  # to proceed smoothly; Kubernetes will bring up a new pod before terminating the old one.
  maxUnavailable: 1